<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railquick - India's First Train On-Seat Essential Delivery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <svg class="logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 00-1-1H9m4-1V8a1 1 0 00-1-1H4a1 1 0 00-1 1v4m0 0v4a1 1 0 001 1h12a1 1 0 001-1v-4m-6-8h.01M9 16h.01"></path>
            </svg>
            <span class="logo-text">Railquick</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-container">
            <!-- India's First Badge -->
            <div class="badge">
                <svg class="badge-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.538 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.783.57-1.838-.197-1.538-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
                <span>India's First</span>
                <svg class="badge-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.538 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.783.57-1.838-.197-1.538-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
            </div>
            
            <h1 class="main-title">
                Train On-Seat
                <br />
                <span class="title-bold">Essential Delivery</span>
            </h1>
            
            <p class="description">
                Travel essentials, medicines, and daily needs delivered 
                directly to your train seat.
            </p>

            <!-- Email Form -->
            <form id="emailForm" class="email-form">
                <div class="form-container">
                    <input 
                        type="email" 
                        id="email"
                        placeholder="Enter your email"
                        class="email-input"
                        required
                    />
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="notify-button"
                    >
                        <span id="btnText">Notify Me</span>
                    </button>
                </div>
            </form>
            
            <div id="message"></div>
            
            <p class="launch-text">
                Launching soon in Delhi railway stations
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 Railquick. Revolutionizing train travel.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
