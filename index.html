<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railquick - India's First Train On-Seat Essential Delivery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="py-8 px-6">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <svg class="w-8 h-8 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 00-1-1H9m4-1V8a1 1 0 00-1-1H4a1 1 0 00-1 1v4m0 0v4a1 1 0 001 1h12a1 1 0 001-1v-4m-6-8h.01M9 16h.01"></path>
            </svg>
            <span class="text-2xl font-light">Railquick</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-6">
        <div class="max-w-2xl w-full text-center">
            <!-- India's First Badge -->
            <div class="badge mb-6">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.538 1.118l2.8-2.034c.783-.57 1.838-.197 1.538 1.81l-1.07 3.292a1 1 0 00.364 1.118L16.638 18.81c.783.57 1.838.197 1.538-1.81l-1.07-3.292a1 1 0 00-.95-.69h-3.462c-.969 0-1.371-1.24-.588-1.81l2.8-2.034a1 1 0 00.364-1.118L9.049 2.927z"/>
                </svg>
                <span>India's First</span>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.538 1.118l2.8-2.034c.783-.57 1.838-.197 1.538 1.81l-1.07 3.292a1 1 0 00.364 1.118L16.638 18.81c.783.57 1.838.197 1.538-1.81l-1.07-3.292a1 1 0 00-.95-.69h-3.462c-.969 0-1.371-1.24-.588-1.81l2.8-2.034a1 1 0 00.364-1.118L9.049 2.927z"/>
                </svg>
            </div>
            
            <h1 class="text-4xl md:text-6xl font-light mb-6 leading-tight">
                Train On-Seat
                <br />
                <span class="font-medium">Essential Delivery</span>
            </h1>
            
            <p class="text-lg md:text-xl text-gray-600 mb-12 leading-relaxed">
                Travel essentials, medicines, and daily needs delivered 
                directly to your train seat.
            </p>

            <!-- Email Form -->
            <form id="emailForm" class="mb-6">
                <div class="flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
                    <input 
                        type="email" 
                        id="email"
                        placeholder="Enter your email"
                        class="input-field"
                        required
                    />
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="btn-primary"
                    >
                        <span id="btnText">Notify Me</span>
                    </button>
                </div>
            </form>
            
            <div id="message"></div>
            
            <p class="text-sm text-gray-500 mt-8">
                Launching soon on major train routes
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 px-6 text-center text-sm text-gray-500">
        <p>© 2025 Railquick. Revolutionizing train travel.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
