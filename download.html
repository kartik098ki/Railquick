<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download RailQuick App</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="Blue and Black Minimalist Brand Logo.ico">

    <!-- Basic Styling -->
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #0f172a;
            --card: #111827;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --brand: #7c3aed;
            --brand2: #22d3ee;
            --radius: 16px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .download-container {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            margin-bottom: 24px;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        p {
            color: var(--muted);
            margin-bottom: 32px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 24px;
            border-radius: var(--radius);
            border: none;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            color: #0b0f1a;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3);
        }

        .footer-note {
            margin-top: 32px;
            font-size: 0.8rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="download-container">
        <div class="logo">
            <span class="logo-text">railquick</span>
        </div>
        <h1>Download RailQuick App</h1>
        <p>Get the RailQuick app to order essentials directly to your train seat. Testing is starting soon in Delhi!</p>
        
        <!-- !!! ACTION REQUIRED: ADD YOUR APP DOWNLOAD LINK HERE !!! -->
        <!-- Replace the href below with the direct GitHub raw link to your app-debug.apk file -->
        <a href="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO_NAME/main/app-debug.apk" class="download-btn" id="downloadLink" download>
            <i class="fas fa-download"></i>
            Download App (APK)
        </a>
        
        <p class="footer-note">By downloading this app, you agree to our terms of service and privacy policy.</p>
    </div>
</body>
</html>
