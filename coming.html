<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RailQuick | Launch Sequence • 18 Dec 2025</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --neon-cyan: #00f5ff;
      --neon-purple: #a855f7;
      --dark-bg: #06070c;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 245, 255, 0.35);
      --text-main: #f5f7fa;
      --text-muted: #b6bcc6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #0b0d18, var(--dark-bg));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated Stars */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('https://www.transparenttextures.com/patterns/stardust.png');
      opacity: 0.25;
      animation: drift 60s linear infinite;
      z-index: 0;
    }

    @keyframes drift {
      from { background-position: 0 0; }
      to { background-position: 1000px 1000px; }
    }

    .wrapper {
      position: relative;
      z-index: 2;
      max-width: 900px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      animation: fadeUp 1.4s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-cyan);
      border: 1px solid var(--border-glow);
      box-shadow: 0 0 20px var(--border-glow);
      margin-bottom: 1.2rem;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      background: linear-gradient(90deg, #ffffff, var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 245, 255, 0.4);
      margin-bottom: 0.6rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      letter-spacing: 1px;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 45px rgba(0, 245, 255, 0.15);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 0 65px rgba(0, 245, 255, 0.25);
    }

    .card h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.8rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      text-align: left;
    }

    .info-item i {
      font-size: 2rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 15px var(--neon-cyan);
    }

    .info-item span {
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .cta {
      margin-top: 3rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; text-shadow: 0 0 25px rgba(255, 255, 255, 0.6); }
    }

    @media (max-width: 768px) {
      .card { padding: 2rem 1.6rem; }
      .info-item { text-align: center; flex-direction: column; }
      .cta { font-size: 1.4rem; letter-spacing: 4px; }
    }
  </style>
</head>
<body>

  <main class="wrapper">
    <span class="badge">Launch Sequence Initiated</span>
    <h1>18 Dec 2025</h1>
    <p class="subtitle">RailQuick • Test Phase 1 • Offline Validation</p>

    <section class="card">
      <h2>Test Phase 1</h2>
      <div class="info">
        <div class="info-item">
          <i class="fas fa-train"></i>
          <span><strong>Start Point</strong><br />Hazrat Nizamuddin Railway Station</span>
        </div>
        <div class="info-item">
          <i class="fas fa-clock"></i>
          <span><strong>Goes Live</strong><br />1:00 PM IST</span>
        </div>
        <div class="info-item">
          <i class="fas fa-rocket"></i>
          <span><strong>Objective</strong><br />Real User Validation & Operations Test</span>
        </div>
      </div>
    </section>

    <div class="cta">Be Ready</div>
  </main>

</body>
</html>
