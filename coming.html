<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Sequence Initiated | 18 Dec 2025</title>
    
    <!-- Google Font: Orbitron & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- =================================== -->
    <!--        EMBEDDED CSS STYLES         -->
    <!-- =================================== -->
    <style>
        /* --- Global Styles & Variables --- */
        :root {
            --primary-color: #00ffff; /* Neon Cyan */
            --secondary-color: #ff00ff; /* Neon Magenta */
            --background-color: #0a0a0f; /* Very dark, almost black */
            --text-color: #f0f0f0;
            --card-bg: rgba(20, 20, 35, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* --- Animated Background --- */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(45deg, #0a0a0f, #1a0033, #001a33, #0a0a0f);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Main Container --- */
        .container {
            max-width: 800px;
            padding: 2rem;
            animation: fadeInUp 1.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Typography --- */
        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--primary-color);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 900;
            line-height: 1;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .info-card h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        /* --- Info Card --- */
        .info-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            margin: 2rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
        }

        .details p {
            font-size: 1.1rem;
            margin: 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            opacity: 0.9;
        }

        .details i {
            font-size: 1.8rem;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* --- Closing Text --- */
        .closing-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #fff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
        }

        /* --- Responsive Design for Phones --- */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }
            
            .info-card {
                padding: 2rem 1.5rem;
            }
            
            .details p {
                font-size: 1rem;
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .tagline {
                letter-spacing: 3px;
            }

            h1 {
                margin-bottom: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background Div -->
    <div class="bg-animation"></div>

    <!-- Main Content Container -->
    <main class="container">
        <header>
            <p class="tagline">The Journey Begins</p>
            <h1>18 Dec 2025</h1>
        </header>

        <section class="info-card">
            <h2>Test Phase 1</h2>
            <div class="details">
                <p class="location">
                    <i class="fas fa-train"></i>
                    Start Point: Hazrat Nizamuddin Railway Station
                </p>
                <p class="time">
                    <i class="fas fa-satellite-dish"></i>
                    Goes Live: 1:00 PM
                </p>
            </div>
        </section>
        
        <footer>
            <p class="closing-text">Be Ready.</p>
        </footer>
    </main>

    <!-- =================================== -->
    <!--        EMBEDDED JAVASCRIPT         -->
    <!-- =================================== -->
    <!-- No JavaScript is needed for this page to function as requested. -->

</body>
</html>
